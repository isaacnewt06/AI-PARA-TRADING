name: APT offline safety checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline safety regressions (no broker, no paid API)
        run: python -m pytest -q tests/unit/test_mt5_bridge.py tests/unit/test_audio_processor.py tests/unit/test_unleashed_ai_protocol.py
